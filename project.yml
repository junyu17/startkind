name: StartKind
options:
  bundleIdPrefix: com.startkind
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
    - ja
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: "255R6QQR97"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
targets:
  StartKind:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # StartKind.xcodeproj is generated and gitignored, so a .swift file added
    # since the last `xcodegen generate` is silently absent from the build.
    # This fails the build instead, naming the file. See the script header.
    preBuildScripts:
      - name: Verify project is in sync with the files on disk
        script: '"$SRCROOT/Scripts/verify-project-sync.sh"'
        basedOnDependencyAnalysis: false
    sources:
      - path: StartKind
        excludes:
          - "Info.plist"
          - "Resources/Assets.xcassets"
          - "Resources/Products.storekit"
      - path: StartKind/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: StartKindShareExtension
        embed: true
      - target: StartKindWidgetExtension
        embed: true
      - target: StartKindWatch
        embed: true
        copy:
          destination: wrapper
          subpath: Watch
    info:
      path: StartKind/Info.plist
      properties:
        CFBundleDisplayName: StartKind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
          - ja
        UILaunchScreen:
          UIColorName: BackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # NSPersistentCloudKitContainer needs this to receive the silent
        # pushes CloudKit sends when another device writes; without it the
        # mirrored store only catches up on a foreground poll.
        UIBackgroundModes:
          - remote-notification
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "StartKind uses the microphone to capture your spoken thoughts and turn them into one small next step."
        NSCameraUsageDescription: "StartKind lets you scan bills, letters, or appointment notes so it can turn them into one small next step."
        NSPhotoLibraryUsageDescription: "StartKind lets you choose screenshots or photos so it can extract text and turn admin tasks into one small next step."
        NSSpeechRecognitionUsageDescription: "StartKind uses speech recognition to turn your spoken thoughts into one small next step."
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: ren.startkind
            CFBundleURLSchemes:
              - startkind
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: ren.startkind.shortcut.stuck
            UIApplicationShortcutItemTitle: "I'm stuck"
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeFavorite
          - UIApplicationShortcutItemType: ren.startkind.shortcut.startFive
            UIApplicationShortcutItemTitle: Start 5 minutes
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypePlay
          - UIApplicationShortcutItemType: ren.startkind.shortcut.rescueYesterday
            UIApplicationShortcutItemTitle: Rescue yesterday
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeTime
          - UIApplicationShortcutItemType: ren.startkind.shortcut.pasteAdmin
            UIApplicationShortcutItemTitle: Paste admin text
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeCompose
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ren.startkind
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: StartKind/StartKind.entitlements
  StartKindShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StartKindShareExtension
        excludes:
          - "Info.plist"
    info:
      path: StartKindShareExtension/Info.plist
      properties:
        CFBundleDisplayName: StartKind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ren.startkind.share
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
  StartKindWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StartKindWidgetExtension
        excludes:
          - "Info.plist"
      - path: StartKind/Shared/StartKindTimerAttributes.swift
    info:
      path: StartKindWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: StartKind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ren.startkind.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: StartKindWidgetExtension/StartKindWidgetExtension.entitlements
  StartKindWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StartKindWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ren.startkind.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StartKind
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: ren.startkind
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
  StartKindTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StartKindTests
        excludes:
          - "Products.storekit"
      - path: StartKindTests/Products.storekit
        buildPhase: resources
    dependencies:
      - target: StartKind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ren.startkind.tests
        GENERATE_INFOPLIST_FILE: YES
  StartKindUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StartKindUITests
    dependencies:
      - target: StartKind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ren.startkind.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StartKind:
    build:
      targets:
        StartKind: all
        StartKindShareExtension: all
        StartKindWidgetExtension: all
        StartKindWatch: all
        StartKindTests: [test]
        StartKindUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: StartKind/Resources/Products.storekit
    test:
      config: Debug
      targets:
        - StartKindTests
        - StartKindUITests
