# startk.livepet.ren -> StartKind API + static site.
#
# Installed into the existing nginx container's conf.d (host path
# /root/livepet/deploy/nginx/conf.d, auto-included via `include
# /etc/nginx/conf.d/*.conf`). It adds ONE server_name and nothing else: ports
# 80/443, sslh, Xray, and the livepet / ppace / trainer vhosts are untouched.
#
# Install only after the bootstrap vhost has obtained the first certificate
# (see docs/BACKEND_DEPLOYMENT.md).

# AI calls cost real money per request, and a room code is only six digits,
# so both are rate limited per client address.
limit_req_zone $binary_remote_addr zone=startkind_ai:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=startkind_join:10m rate=10r/m;
# `limit_req_status` is already set once at http level by ppace.conf; nginx
# rejects a duplicate, and 429 is what we want anyway.

server {
    listen 80;
    listen [::]:80;
    server_name startk.livepet.ren;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name startk.livepet.ren;

    # Independent certificate; the livepet, ppace and trainer certs are not touched.
    ssl_certificate     /etc/letsencrypt/live/startk.livepet.ren/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/startk.livepet.ren/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Static marketing/legal site.
    root /var/www/livepet-site/startkind;
    index index.html;

    # Receipts are the largest body the API accepts.
    client_max_body_size 512k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /health {
        proxy_pass http://startkind-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store";
    }

    location = /v1/next-step {
        limit_req zone=startkind_ai burst=3 nodelay;
        proxy_pass http://startkind-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /v1/admin-parse {
        limit_req zone=startkind_ai burst=3 nodelay;
        proxy_pass http://startkind-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /v1/costart/rooms/join {
        limit_req zone=startkind_join burst=5;
        proxy_pass http://startkind-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    # Remaining API routes: device registration, receipts, room lifecycle.
    location /v1/ {
        proxy_pass http://startkind-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
